name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1: run the unit and API tests
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Job 2: build the Docker image, test the running container, scan it
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: calculator-eks:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Start container
        run: docker run -d --name app -p 3000:3000 "$IMAGE"

      - name: Smoke test the running container
        run: |
          for i in $(seq 1 15); do
            curl -fs http://localhost:3000/health && break
            echo "Waiting for app to start ($i)..."
            sleep 1
          done
          curl -fs http://localhost:3000/health
          curl -fs "http://localhost:3000/add?a=2&b=3" | grep '"result":5'

      - name: Show container logs on failure
        if: failure()
        run: docker logs app

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "$IMAGE"
