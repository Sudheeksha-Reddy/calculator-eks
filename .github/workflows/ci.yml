name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1: run the unit and API tests
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Job 2: build the Docker image, test the running container, scan it,
  # and on main only, push it to Amazon ECR
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token for AWS
    env:
      IMAGE: calculator-eks:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Start container
        run: docker run -d --name app -p 3000:3000 "$IMAGE"

      - name: Smoke test the running container
        run: |
          for i in $(seq 1 15); do
            curl -fs http://localhost:3000/health && break
            echo "Waiting for app to start ($i)..."
            sleep 1
          done
          curl -fs http://localhost:3000/health
          curl -fs "http://localhost:3000/add?a=2&b=3" | grep '"result":5'

      - name: Show container logs on failure
        if: failure()
        run: docker logs app

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "$IMAGE"

      # The steps below run only after a merge to main, never on pull requests.
      # The AWS role trusts only this repo's main branch.
      - name: Log in to AWS with OIDC (no access keys)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker tag "$IMAGE" "$ECR_IMAGE"
          docker push "$ECR_IMAGE"
          echo "Pushed: $ECR_IMAGE" >> "$GITHUB_STEP_SUMMARY"
